<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f0e" />
  <meta name="description" content="SAUS – SecuLayer Assistant for Unified Security" />

  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon-180.png?v=2">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=2">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Runtime environment configuration (generated by entrypoint.sh) -->
  <script src="%PUBLIC_URL%/env-config.js"></script>

  <title>SAUS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('saus-ui-mode');
      var mode = (saved === 'light' || saved === 'dark') ? saved : 'dark';
      document.body.classList.add('theme-' + mode, 'dens-compact');
    } catch (e) {
      document.body.classList.add('theme-dark', 'dens-compact');
    }
  })();
</script>
<noscript>이 애플리케이션을 실행하려면 JavaScript를 활성화해야 합니다.</noscript>
<div id="root"></div>
</body>
</html>
